<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gigalator">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Gigalator</title>
</head>
<body>
  <div id="app">
    <header id="header">
      <button id="back-btn" class="header-btn hidden" aria-label="Back">&#8592;</button>
      <h1 id="header-title">Gigalator</h1>
      <div class="header-spacer"></div>
    </header>
    <main id="main"></main>
    <div id="player" class="hidden">
      <button id="play-btn" aria-label="Play">&#9654;</button>
      <div id="progress-wrap">
        <div id="progress-bar"></div>
      </div>
      <span id="time-display">0:00</span>
      <span id="track-label" class="hidden"></span>
      <button id="next-btn" class="next-btn" aria-label="Next Song">&#x23ED;&#xFE0E;</button>
    </div>
  </div>
  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
