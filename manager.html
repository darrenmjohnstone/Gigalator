<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gigalator Manager</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f5;
      --bg-white: #fff;
      --bg-hover: #eee;
      --border: #ddd;
      --text: #222;
      --text-dim: #666;
      --accent: #e08820;
      --accent-light: #fff3e0;
      --danger: #d32f2f;
      --danger-light: #ffebee;
      --success: #2e7d32;
      --sidebar-w: 280px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
    }

    /* ── Layout ── */

    #app { display: flex; height: 100%; }

    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-white);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #editor {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
    }

    /* ── Welcome screen ── */

    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      gap: 16px;
    }

    #welcome h1 { font-size: 28px; font-weight: 700; }
    #welcome p { color: var(--text-dim); max-width: 400px; line-height: 1.5; }

    /* ── Buttons ── */

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-white);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--bg-hover); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover { background: #c07010; }

    .btn-danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-danger:hover { background: var(--danger-light); }

    .btn-sm { padding: 4px 10px; font-size: 13px; }

    /* ── Sidebar ── */

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h2 { font-size: 16px; font-weight: 600; }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
    }

    .sidebar-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .sidebar-search {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-search-input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: var(--bg);
    }

    .sidebar-search-input:focus {
      border-color: var(--accent);
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .sidebar-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-item:hover { background: var(--bg); }
    .sidebar-item.active { background: var(--accent-light); }

    .sidebar-reorder {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex-shrink: 0;
      margin-left: 4px;
    }

    .sidebar-move-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-dim);
      font-size: 10px;
      padding: 0 4px;
      cursor: pointer;
      line-height: 14px;
    }

    .sidebar-move-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .sidebar-item-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-item-sub {
      font-size: 12px;
      color: var(--text-dim);
    }

    .sidebar-item-badge {
      font-size: 11px;
      background: var(--accent);
      color: #fff;
      padding: 1px 6px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    /* ── Editor form ── */

    .editor-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--bg-white);
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group input[type="text"]:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea {
      min-height: 200px;
      resize: vertical;
      font-family: "SF Mono", "Menlo", "Monaco", monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .lyrics-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      background: var(--bg-card, #f6f6f6);
    }

    .lyrics-toolbar + textarea {
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }

    .fmt-btn {
      background: var(--bg-white, #fff);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      line-height: 1;
      min-width: 32px;
    }

    .fmt-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .fmt-btn:active {
      transform: translateY(1px);
    }

    .fmt-btn.ai-format-btn {
      margin-left: 8px;
      background: linear-gradient(135deg, #f0a030, #e08020);
      color: #fff;
      border-color: transparent;
      font-weight: 600;
      padding: 4px 14px;
    }
    .fmt-btn.ai-format-btn:hover { filter: brightness(1.08); }
    .fmt-btn.ai-format-btn:disabled { opacity: 0.6; cursor: wait; }

    .fmt-hint {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-dim);
      font-family: "SF Mono", "Menlo", monospace;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group { flex: 1; }

    /* ── Track upload ── */

    .track-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .track-name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
    }

    .track-none {
      color: var(--text-dim);
      font-style: italic;
    }

    /* ── Font size slider ── */

    .font-size-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .font-size-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .font-size-value {
      font-size: 14px;
      font-weight: 600;
      min-width: 40px;
      text-align: center;
    }

    /* ── Setlist editor ── */

    .setlist-songs {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .setlist-song-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-white);
    }

    .setlist-song-item:last-child { border-bottom: none; }

    .setlist-song-item .song-name { flex: 1; font-size: 14px; }

    .setlist-song-item .move-btns {
      display: flex;
      gap: 4px;
    }

    .move-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--text-dim);
    }

    .move-btn:hover { background: var(--bg); }

    .remove-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
    }

    /* ── Add songs to setlist (multi-select) ── */

    .song-picker {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .song-picker-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .song-picker-search {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .song-picker-search:focus {
      border-color: var(--accent);
    }

    .song-picker-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .song-picker-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.1s;
    }

    .song-picker-item:hover { background: var(--bg); }
    .song-picker-item:last-child { border-bottom: none; }

    .song-picker-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .song-picker-item .picker-title { flex: 1; }
    .song-picker-item .picker-artist { color: var(--text-dim); font-size: 12px; }

    .song-picker-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .song-picker-count {
      flex: 1;
      font-size: 12px;
      color: var(--text-dim);
    }

    .song-picker-empty {
      padding: 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }

    /* ── Actions bar ── */

    .actions-bar {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .actions-bar .spacer { flex: 1; }

    /* ── Status bar ── */

    .status-bar {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      background: var(--bg-white);
      text-align: center;
    }

    .status-bar.saved { color: var(--success); }
    .status-bar.error { color: var(--danger); }

    /* ── Deploy button ── */

    .deploy-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    .btn-deploy {
      width: 100%;
      padding: 14px 16px;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-deploy:hover { background: #256b29; }
    .btn-deploy:disabled { background: #888; cursor: not-allowed; }

    .btn-deploy.deploying { background: #e08820; }
    .btn-deploy.success { background: #2e7d32; }
    .btn-deploy.failed { background: #d32f2f; }

    /* ── Token modal ── */

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--bg-white);
      border-radius: 12px;
      padding: 24px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .modal h3 { font-size: 18px; margin-bottom: 12px; }
    .modal p { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 16px; }

    .modal input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .modal-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* ── Sheet Images ── */

    .sheets-section { margin-top: 4px; }

    .sheets-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .sheet-slot {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: 8px;
      min-width: 200px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s;
      overflow: hidden;
      background: #fafafa;
    }

    .sheet-slot:hover { border-color: var(--accent); }

    .sheet-slot.has-image {
      border-style: solid;
      cursor: default;
    }

    .sheet-slot img {
      display: block;
      width: 100%;
      height: auto;
    }

    .sheet-placeholder {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      padding: 16px;
    }

    .sheet-placeholder span { font-size: 28px; display: block; margin-bottom: 4px; }

    .sheet-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .sheet-slot:hover .sheet-remove { opacity: 1; }

    .sheet-size-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .sheet-size-row input[type="range"] {
      flex: 1;
      max-width: 200px;
    }

    /* ── Live iPad Preview ── */

    .preview-container {
      margin-top: 8px;
      position: relative;
      /* Height set dynamically by JS based on scale */
    }

    .preview-label-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .preview-device-label {
      font-size: 12px;
      color: var(--text-dim);
    }

    .preview-device-select {
      font-size: 12px;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .preview-scaler {
      /* This div is the actual iPad resolution, scaled down with transform */
      transform-origin: top left;
      /* width/height/transform set by JS */
    }

    /* ── Skeuomorphic iPad device bezel ── */
    .device-bezel {
      position: relative;
      background: #111;
      box-sizing: border-box;
      box-shadow: 0 0 0 2px #1a1a1a, 0 8px 32px rgba(0,0,0,0.4);
      /* width/height/padding/border-radius set by JS per device */
    }
    .device-screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      position: relative;
      border-radius: inherit;
    }
    .device-cam {
      /* Front camera dot. Position is rotated by JS via the rotation class. */
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2a2a2a;
      z-index: 2;
      pointer-events: none;
    }
    .device-home {
      /* Physical home button — only visible on the 9th-gen device. */
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      box-shadow: inset 0 0 0 1px #0a0a0a;
      z-index: 2;
      pointer-events: none;
      display: none; /* hidden by default — JS adds .has-home for ipad-9 */
    }
    .device-bezel.has-home .device-home { display: block; }

    /* iPad 9th gen: thicker bezels, home button on one side */
    .device-bezel.ipad-9.landscape .device-home  { right: 16px; top: 50%; transform: translateY(-50%); }
    .device-bezel.ipad-9.landscape .device-cam   { left: 16px;  top: 50%; transform: translate(-50%, -50%); }
    .device-bezel.ipad-9.portrait  .device-home  { bottom: 16px; left: 50%; transform: translateX(-50%); }
    .device-bezel.ipad-9.portrait  .device-cam   { top: 16px;    left: 50%; transform: translate(-50%, -50%); }

    /* iPad Pro: thin uniform bezels, no home button, front camera centered on top edge */
    .device-bezel.ipad-pro.landscape .device-cam { left: 8px;  top: 50%; transform: translate(-50%, -50%); }
    .device-bezel.ipad-pro.portrait  .device-cam { top: 8px;   left: 50%; transform: translate(-50%, -50%); }

    .preview-frame {
      background: #1a1a1a;
      border: none;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      /* Exact pixel dimensions set by JS to match iPad */
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: calc(12px + var(--preview-safe-top, 0px));
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      background: #111;
      min-height: 56px;
    }

    .preview-header-title {
      color: #e8e8e8;
      font-size: 20px;
      font-weight: 600;
      flex: 1;
      text-align: center;
    }

    .preview-header-btn {
      color: #f0a030;
      font-size: 24px;
      min-width: 44px;
      text-align: center;
    }

    .preview-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 16px;
      background: #1a1a1a;
    }

    .preview-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      margin-bottom: 12px;
    }

    .preview-artist {
      font-size: 16px;
      color: #999;
    }

    .preview-font-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-font-btn {
      background: #252525;
      border: 1px solid #444;
      color: #f0a030;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .preview-font-label {
      font-size: 13px;
      color: #999;
      min-width: 36px;
      text-align: center;
    }

    /* Bottom nav — matches the iPad .bottom-nav */
    .preview-bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0 0;
      flex-shrink: 0;
    }

    .preview-bnav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #252525;
      border: 1px solid #444;
      color: #f0a030;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      min-height: 48px;
      flex: 1;
    }

    .preview-bnav-next {
      background: #f0a030;
      color: #111;
      border-color: #f0a030;
    }

    .preview-bnav-icon {
      font-size: 22px;
      line-height: 1;
    }

    /* Player bar — matches the iPad #player */
    .preview-player {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--preview-safe-bottom, 0px));
      background: #111;
      border-top: 1px solid #333;
      flex-shrink: 0;
    }

    .preview-player-time {
      font-size: 14px;
      color: #999;
      min-width: 48px;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }

    .preview-player-progress {
      flex: 1;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }

    .preview-player-progress-bar {
      height: 100%;
      width: 35%;
      background: #f0a030;
      border-radius: 3px;
    }

    .preview-player-play {
      background: #f0a030;
      color: #111;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .preview-lyrics-scroll {
      flex: 1;
      overflow: hidden;
      display: flex;
      position: relative;
    }

    .preview-lyrics {
      min-width: 200%;
      width: 200%;
      height: 100%;
      overflow: hidden;
      column-count: 4;
      column-gap: 32px;
      column-rule: 1px solid #333;
      column-fill: auto;
      white-space: pre-wrap;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 300;
      line-height: 1.6;
      transition: transform 0.3s ease;
      /* font-size set by JS to actual iPad font size (no scaling!) */
    }

    /* Portrait preview: single column, scrollable vertically — matches iPad portrait mode */
    .preview-frame.preview-portrait .preview-lyrics {
      column-count: 1;
      min-width: 100%;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .preview-frame.preview-portrait .preview-lyrics-scroll {
      overflow-y: auto;
      overflow-x: hidden;
    }
    .preview-frame.preview-portrait .preview-page-bar {
      display: none;
    }

    /* Inline lyric formatting — must match app.js / styles.css on iPad */
    .preview-lyrics strong {
      font-weight: 700;
      color: #fff;
    }
    .preview-lyrics em {
      font-style: italic;
      color: var(--accent);
    }
    .preview-lyrics u {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      text-decoration-color: var(--accent);
    }
    .preview-lyrics mark {
      background: #ffd84a;
      color: #111;
      padding: 0 4px;
      border-radius: 3px;
      font-weight: 500;
    }

    .preview-page-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px 0 4px;
      flex-shrink: 0;
    }

    .preview-page-btn {
      background: #333;
      border: 1px solid #555;
      color: #e8e8e8;
      font-size: 13px;
      padding: 4px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .preview-page-btn:hover {
      background: #444;
    }

    .preview-page-btn.active {
      background: #f0a030;
      border-color: #f0a030;
      color: #111;
    }

    .preview-overflow-warn {
      position: absolute;
      bottom: 12px;
      right: 16px;
      background: #d32f2f;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 4px;
      display: none;
    }

    .preview-overflow-warn.visible {
      display: block;
    }

    /* ── Deploy info ── */

    .deploy-info {
      margin-top: 24px;
      padding: 16px;
      background: #f0f7ff;
      border: 1px solid #c0d8f0;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      color: #335;
    }

    .deploy-info strong {
      color: #224;
    }

    /* Electron mode — hide unnecessary browser-only elements */
    .electron-mode #open-folder-btn,
    .electron-mode #welcome { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div class="sidebar-header">
        <h2>Gigalator</h2>
        <button class="btn btn-sm" id="open-folder-btn">Open Folder</button>
      </div>
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="songs">Songs</button>
        <button class="sidebar-tab" data-tab="setlists">Setlists</button>
      </div>
      <div class="sidebar-search">
        <input type="text" class="sidebar-search-input" id="sidebar-search" placeholder="Search..." autocomplete="off">
      </div>
      <div class="sidebar-list" id="sidebar-list"></div>
      <div class="sidebar-footer">
        <button class="btn btn-primary" id="add-btn" style="width:100%" disabled>+ Add Song</button>
      </div>
      <div class="deploy-bar">
        <button class="btn-deploy" id="deploy-btn" disabled>Deploy to iPad App</button>
      </div>
      <div class="status-bar" id="status-bar">No folder open</div>
    </div>
    <div id="editor">
      <div id="welcome">
        <h1>Gigalator Manager</h1>
        <p>Open your local Gigalator project folder to start managing songs, lyrics, and backing tracks.</p>
        <button class="btn btn-primary" id="open-folder-btn-main">Open Gigalator Folder</button>
        <p style="font-size:12px;color:var(--text-dim);margin-top:8px">Requires Chrome or Edge</p>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    // ── Electron detection ──
    var isElectron = !!(window.electronAPI);

    // ── State ──
    var dirHandle = null;
    var songsHandle = null;
    var tracksHandle = null;
    var sheetsHandle = null;
    var data = null;
    var activeTab = 'songs';
    var selectedId = null;
    var dirty = false;
    var folderReady = false;

    // ── DOM ──
    var sidebarList = document.getElementById('sidebar-list');
    var editor = document.getElementById('editor');
    var statusBar = document.getElementById('status-bar');
    var addBtn = document.getElementById('add-btn');

    // ── Open Folder ──
    document.getElementById('open-folder-btn').addEventListener('click', openFolder);
    document.getElementById('open-folder-btn-main').addEventListener('click', openFolder);

    async function openFolder() {
      try {
        if (isElectron) {
          // Electron mode: folder is auto-resolved by the main process
          await window.electronAPI.ensureDir('tracks');
          await window.electronAPI.ensureDir('sheets');
          folderReady = true;
        } else {
          // Browser mode: use File System Access API
          dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });

          var songsDir = await dirHandle.getDirectoryHandle('songs');
          songsHandle = await songsDir.getFileHandle('songs.json');

          try {
            tracksHandle = await dirHandle.getDirectoryHandle('tracks');
          } catch (e) {
            tracksHandle = await dirHandle.getDirectoryHandle('tracks', { create: true });
          }

          try {
            sheetsHandle = await dirHandle.getDirectoryHandle('sheets');
          } catch (e) {
            sheetsHandle = await dirHandle.getDirectoryHandle('sheets', { create: true });
          }
        }

        await loadData();
        addBtn.disabled = false;
        deployBtn.disabled = false;
        setStatus(isElectron ? 'Gigalator folder loaded' : 'Folder opened: ' + dirHandle.name);
      } catch (e) {
        if (e.name !== 'AbortError') {
          setStatus('Failed to open folder: ' + e.message, 'error');
        }
      }
    }

    async function loadData() {
      var text;
      if (isElectron) {
        text = await window.electronAPI.readTextFile('songs/songs.json');
      } else {
        var file = await songsHandle.getFile();
        text = await file.text();
      }
      data = JSON.parse(text);
      renderSidebar();
      showWelcome();
    }

    async function saveData() {
      if (isElectron) {
        await window.electronAPI.writeTextFile('songs/songs.json', JSON.stringify(data, null, 2));
      } else {
        var writable = await songsHandle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
      }
      dirty = false;
      setStatus('Saved', 'saved');
    }

    // Auto-open in Electron mode
    if (isElectron) {
      document.body.classList.add('electron-mode');
      openFolder();
    }

    // ── Tab switching ──
    var sidebarSearchInput = document.getElementById('sidebar-search');

    document.querySelectorAll('.sidebar-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        activeTab = tab.getAttribute('data-tab');
        document.querySelectorAll('.sidebar-tab').forEach(function (t) {
          t.classList.toggle('active', t === tab);
        });
        addBtn.textContent = activeTab === 'songs' ? '+ Add Song' : '+ Add Setlist';
        selectedId = null;
        sidebarSearchInput.value = '';
        renderSidebar();
        showWelcome();
      });
    });

    // ── Sidebar search ──
    sidebarSearchInput.addEventListener('input', function () {
      var q = sidebarSearchInput.value.trim().toLowerCase();
      sidebarList.querySelectorAll('.sidebar-item').forEach(function (el) {
        if (q.length < 2) {
          el.style.display = '';
          return;
        }
        var title = el.querySelector('.sidebar-item-title').textContent.toLowerCase();
        var sub = el.querySelector('.sidebar-item-sub').textContent.toLowerCase();
        el.style.display = (title.includes(q) || sub.includes(q)) ? '' : 'none';
      });
    });

    // ── Add button ──
    addBtn.addEventListener('click', function () {
      if (!data) return;
      if (activeTab === 'songs') {
        addNewSong();
      } else {
        addNewSetlist();
      }
    });

    // ── Render sidebar ──
    function renderSidebar() {
      if (!data) { sidebarList.innerHTML = ''; return; }

      var html = '';

      if (activeTab === 'songs') {
        var songIds = Object.keys(data.songs).sort(function (a, b) {
          return data.songs[a].title.localeCompare(data.songs[b].title);
        });

        songIds.forEach(function (id) {
          var song = data.songs[id];
          var cls = id === selectedId ? ' active' : '';
          html += '<div class="sidebar-item' + cls + '" data-id="' + id + '">'
            + '<div>'
            + '<div class="sidebar-item-title">' + esc(song.title) + '</div>'
            + '<div class="sidebar-item-sub">' + esc(song.artist) + '</div>'
            + '</div>'
            + (song.track ? '<span class="sidebar-item-badge">Track</span>' : '')
            + '</div>';
        });
      } else {
        data.setlists.forEach(function (sl, i) {
          var cls = selectedId === sl.id ? ' active' : '';
          html += '<div class="sidebar-item' + cls + '" data-id="' + sl.id + '" data-index="' + i + '">'
            + '<div>'
            + '<div class="sidebar-item-title">' + esc(sl.name) + '</div>'
            + '<div class="sidebar-item-sub">' + sl.songs.length + ' songs</div>'
            + '</div>'
            + '<div class="sidebar-reorder">'
            + '<button class="sidebar-move-btn" data-sl-dir="up" data-sl-i="' + i + '" title="Move up">&#8593;</button>'
            + '<button class="sidebar-move-btn" data-sl-dir="down" data-sl-i="' + i + '" title="Move down">&#8595;</button>'
            + '</div>'
            + '</div>';
        });
      }

      sidebarList.innerHTML = html;

      sidebarList.querySelectorAll('.sidebar-item').forEach(function (el) {
        el.addEventListener('click', function (e) {
          // Don't trigger navigation if clicking a reorder button
          if (e.target.classList.contains('sidebar-move-btn')) return;
          selectedId = el.getAttribute('data-id');
          renderSidebar();
          if (activeTab === 'songs') {
            showSongEditor(selectedId);
          } else {
            showSetlistEditor(selectedId);
          }
        });
      });

      // Setlist reorder buttons
      sidebarList.querySelectorAll('.sidebar-move-btn').forEach(function (btn) {
        btn.addEventListener('click', async function (e) {
          e.stopPropagation();
          var idx = parseInt(btn.getAttribute('data-sl-i'), 10);
          var dir = btn.getAttribute('data-sl-dir');
          var moved = false;
          if (dir === 'up' && idx > 0) {
            var tmp = data.setlists[idx];
            data.setlists[idx] = data.setlists[idx - 1];
            data.setlists[idx - 1] = tmp;
            moved = true;
          } else if (dir === 'down' && idx < data.setlists.length - 1) {
            var tmp2 = data.setlists[idx];
            data.setlists[idx] = data.setlists[idx + 1];
            data.setlists[idx + 1] = tmp2;
            moved = true;
          }
          renderSidebar();
          // CRITICAL: persist to songs.json so the Deploy button has
          // something to push. Without this, reorders were UI-only.
          if (moved) await saveData();
        });
      });
    }

    // ── Welcome ──
    function showWelcome() {
      if (!data) return;
      var total = Object.keys(data.songs).length;
      var trackCount = Object.values(data.songs).filter(function (s) { return s.track; }).length;
      editor.innerHTML = '<div id="welcome">'
        + '<h1>Gigalator Manager</h1>'
        + '<p>' + total + ' songs, ' + trackCount + ' with backing tracks, ' + data.setlists.length + ' setlists</p>'
        + '<p style="color:var(--text-dim)">Select a song or setlist from the sidebar to edit, or click + to add new.</p>'
        + '<div class="deploy-info" style="max-width:500px;margin-top:24px">'
        + '<strong>Deploy to iPad app:</strong><br>'
        + 'After making changes, hit the green <strong>Deploy to iPad App</strong> button in the sidebar. '
        + 'Then open the app on your iPad with WiFi to pick up the changes.'
        + '</div>'
        + '</div>';
    }

    // ── Song Editor ──
    function showSongEditor(songId) {
      var song = data.songs[songId];
      if (!song) return;

      var trackDisplay = song.track
        ? '<span class="track-name">' + esc(song.track) + '</span>'
          + '<button class="btn btn-sm btn-danger" id="remove-track-btn">Remove</button>'
        : '<span class="track-name track-none">No backing track</span>';

      editor.innerHTML = '<div class="editor-title">Edit Song</div>'
        + '<div class="form-row">'
        + '<div class="form-group">'
        + '<label>Title</label>'
        + '<input type="text" id="song-title" value="' + escAttr(song.title) + '">'
        + '</div>'
        + '<div class="form-group">'
        + '<label>Artist</label>'
        + '<input type="text" id="song-artist" value="' + escAttr(song.artist) + '">'
        + '</div>'
        + '</div>'
        + '<div class="form-group">'
        + '<label>Lyrics</label>'
        + '<div class="lyrics-toolbar">'
        + '<button type="button" class="fmt-btn" data-fmt="bold" title="Bold (⌘B)"><b>B</b></button>'
        + '<button type="button" class="fmt-btn" data-fmt="italic" title="Italic (⌘I)"><i>I</i></button>'
        + '<button type="button" class="fmt-btn" data-fmt="underline" title="Underline (⌘U)"><u>U</u></button>'
        + '<button type="button" class="fmt-btn" data-fmt="highlight" title="Highlight"><span style="background:#ffe380;padding:0 4px;border-radius:2px">H</span></button>'
        + '<button type="button" class="fmt-btn ai-format-btn" id="ai-format-btn" title="Clean up pasted lyrics with AI">&#10024; AI Format</button>'
        + '<span class="fmt-hint">Markdown: **bold** · *italic* · __underline__ · ==highlight==</span>'
        + '</div>'
        + '<textarea id="song-lyrics">' + esc(song.lyrics) + '</textarea>'
        + '</div>'
        + '<div class="form-group">'
        + '<label>Backing Track</label>'
        + '<div class="track-info" id="track-info">' + trackDisplay + '</div>'
        + '<div style="margin-top:8px">'
        + '<button class="btn btn-sm" id="upload-track-btn">Upload MP3</button>'
        + '</div>'
        + '</div>'
        + '<div class="form-group sheets-section">'
        + '<label>Sheet Images <span style="font-weight:normal;color:var(--text-dim)">(up to 5 pages)</span></label>'
        + '<div style="margin-bottom:8px;display:flex;gap:8px">'
        + '<button class="btn btn-sm" id="upload-pdf-sheets-btn">Upload PDF (auto-split pages)</button>'
        + '<button class="btn btn-sm" id="clear-all-sheets-btn" style="background:var(--danger-light);color:var(--danger)">Clear All</button>'
        + '</div>'
        + '<div class="sheets-grid" id="sheets-grid">'
        + (function () {
          var slotsHtml = '';
          for (var si = 0; si < 5; si++) {
            var hasSheet = song.sheets && song.sheets[si];
            slotsHtml += '<div class="sheet-slot' + (hasSheet ? ' has-image' : '') + '" id="sheet-slot-' + si + '" data-index="' + si + '">'
              + (hasSheet
                ? '<img src="" id="sheet-img-' + si + '"><button class="sheet-remove" data-index="' + si + '">&times;</button>'
                : '<div class="sheet-placeholder"><span>+</span>Page ' + (si + 1) + '</div>')
              + '</div>';
          }
          return slotsHtml;
        })()
        + '</div>'
        + '<div class="sheet-size-row">'
        + '<span>Small</span>'
        + '<input type="range" id="sheet-size-slider" min="200" max="800" value="' + (song.sheetSize || 400) + '">'
        + '<span>Large</span>'
        + '<span id="sheet-size-val" style="min-width:40px">' + (song.sheetSize || 400) + 'px</span>'
        + '</div>'
        + '</div>'
        + '<div class="form-group">'
        + '<label>Font Size (iPad lyrics view)</label>'
        + '<div class="font-size-row">'
        + '<span>10px</span>'
        + '<input type="range" id="song-fontsize" min="10" max="36" value="' + (song.fontSize || 20) + '">'
        + '<span>36px</span>'
        + '<span class="font-size-value" id="fontsize-val">' + (song.fontSize || 20) + 'px</span>'
        + '</div>'
        + '</div>'
        + '<div class="form-group">'
        + '<label>iPad Preview</label>'
        + '<div class="preview-label-bar">'
        + '<span class="preview-device-label">Device:</span>'
        + '<select class="preview-device-select" id="preview-device">'
        + '<option value="ipad-pro-11">iPad Pro 11&quot;</option>'
        + '<option value="ipad-pro-13">iPad Pro 12.9&quot;</option>'
        + '<option value="ipad-9" selected>iPad 9th gen</option>'
        + '</select>'
        + '<span class="preview-device-label" style="margin-left:12px">Orientation:</span>'
        + '<select class="preview-device-select" id="preview-orientation">'
        + '<option value="portrait">Portrait</option>'
        + '<option value="landscape" selected>Landscape</option>'
        + '</select>'
        + '</div>'
        + '<div class="preview-container" id="preview-container">'
        + '<div class="preview-scaler" id="preview-scaler">'
        + '<div class="device-bezel" id="device-bezel">'
        + '<div class="device-cam"></div>'
        + '<div class="device-screen">'
        + '<div class="preview-frame" id="preview-frame">'
        + '<div class="preview-header">'
        + '<span class="preview-header-btn">&#8592;</span>'
        + '<span class="preview-header-title">' + esc(song.title) + '</span>'
        + '<span class="preview-header-btn">&#x23ED;&#xFE0E;</span>'
        + '</div>'
        + '<div class="preview-body">'
        + '<div class="preview-top-bar">'
        + '<div class="preview-artist">' + esc(song.artist) + '</div>'
        + '<div class="preview-font-controls">'
        + '<span class="preview-font-btn">&#8722;</span>'
        + '<span class="preview-font-label" id="preview-font-label">30px</span>'
        + '<span class="preview-font-btn">&#43;</span>'
        + '</div>'
        + '</div>'
        + '<div class="preview-lyrics-scroll" id="preview-lyrics-scroll">'
        + '<div class="preview-lyrics" id="preview-lyrics">' + esc(song.lyrics) + '</div>'
        + '</div>'
        + '<div class="preview-page-bar">'
        + '<button class="preview-page-btn active" id="preview-page1">Page 1</button>'
        + '<button class="preview-page-btn" id="preview-page2">Page 2</button>'
        + '</div>'
        + '<div class="preview-bottom-nav">'
        + '<div class="preview-bnav-btn"><span class="preview-bnav-icon">&#8249;</span>Back</div>'
        + '<div class="preview-bnav-btn"><span class="preview-bnav-icon">&#9776;</span>Setlists</div>'
        + '<div class="preview-bnav-btn preview-bnav-next">Next <span class="preview-bnav-icon">&#8250;</span></div>'
        + '</div>'
        + '</div>'
        + '<div class="preview-player">'
        + '<span class="preview-player-time">0:00</span>'
        + '<div class="preview-player-progress"><div class="preview-player-progress-bar"></div></div>'
        + '<div class="preview-player-play">&#9654;</div>'
        + '</div>'
        + '<div class="preview-overflow-warn" id="preview-overflow">OVERFLOWS — reduce font size</div>'
        + '</div>'
        + '</div>'   /* device-screen */
        + '<div class="device-home"></div>' /* home button (only shown for ipad-9) */
        + '</div>'   /* device-bezel */
        + '</div>'   /* preview-scaler */
        + '</div>'   /* preview-container */
        + '</div>'
        + '<div class="deploy-info">'
        + '<strong>To update your iPad app:</strong> Hit the green <strong>Deploy to iPad App</strong> button in the sidebar. '
        + 'For new backing tracks, use <code>deploy.command</code> in your Gigalator folder.'
        + '</div>'
        + '<div class="actions-bar">'
        + '<button class="btn btn-danger" id="delete-song-btn">Delete Song</button>'
        + '<div class="spacer"></div>'
        + '<button class="btn btn-primary" id="save-song-btn">Save Changes</button>'
        + '</div>';

      // Font size slider + live preview
      var slider = document.getElementById('song-fontsize');
      var fsVal = document.getElementById('fontsize-val');
      var previewEl = document.getElementById('preview-lyrics');
      var overflowWarn = document.getElementById('preview-overflow');
      var lyricsTextarea = document.getElementById('song-lyrics');

      // ── Lyrics formatting toolbar ──
      // Wraps selection in markdown-style markers so chord alignment stays intact.
      var FMT_WRAPPERS = {
        bold:      { open: '**', close: '**' },
        italic:    { open: '*',  close: '*'  },
        underline: { open: '__', close: '__' },
        highlight: { open: '==', close: '==' }
      };

      function wrapSelection(fmt) {
        var w = FMT_WRAPPERS[fmt];
        if (!w) return;
        var ta = lyricsTextarea;
        var start = ta.selectionStart;
        var end = ta.selectionEnd;
        var before = ta.value.slice(0, start);
        var selected = ta.value.slice(start, end);
        var after = ta.value.slice(end);

        // Toggle: if the selection is already wrapped, unwrap it.
        if (selected.startsWith(w.open) && selected.endsWith(w.close)
            && selected.length >= w.open.length + w.close.length) {
          var unwrapped = selected.slice(w.open.length, selected.length - w.close.length);
          ta.value = before + unwrapped + after;
          ta.selectionStart = start;
          ta.selectionEnd = start + unwrapped.length;
        } else {
          ta.value = before + w.open + selected + w.close + after;
          if (selected.length === 0) {
            // No selection — place cursor between the markers ready to type
            ta.selectionStart = ta.selectionEnd = start + w.open.length;
          } else {
            ta.selectionStart = start + w.open.length;
            ta.selectionEnd = start + w.open.length + selected.length;
          }
        }
        ta.focus();
        // Fire input event so preview updates and dirty state is tracked
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }

      document.querySelectorAll('.fmt-btn').forEach(function (btn) {
        // Skip the AI Format button — it's not a wrap-selection action
        if (btn.id === 'ai-format-btn') return;
        btn.addEventListener('click', function () {
          wrapSelection(btn.dataset.fmt);
        });
      });

      // ── AI Format button ──
      // Sends the textarea contents (typically pasted-in messy lyrics from
      // a chord site or songbook) to the local API server, which calls
      // Claude to clean up the text — strips chord notation / ads / page
      // numbers, marks sections as **[Verse 1]**, makes choruses bold +
      // highlighted. Result replaces the textarea so the user can review.
      var aiBtn = document.getElementById('ai-format-btn');
      if (aiBtn) {
        aiBtn.addEventListener('click', async function () {
          var current = lyricsTextarea.value;
          if (!current.trim()) {
            alert('Paste some lyrics into the textarea first, then click AI Format.');
            return;
          }
          if (!confirm('Clean up the current lyrics with AI?\n\nThis replaces the textarea contents — but you can review and edit before saving.')) {
            return;
          }

          var origLabel = aiBtn.innerHTML;
          aiBtn.innerHTML = '✨ Formatting...';
          aiBtn.disabled = true;

          try {
            var titleEl = document.getElementById('song-title');
            var artistEl = document.getElementById('song-artist');
            var resp = await fetch('http://localhost:3111/api/format-lyrics', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                text: current,
                title: titleEl ? titleEl.value : '',
                artist: artistEl ? artistEl.value : ''
              })
            });
            if (!resp.ok) {
              var err = await resp.json().catch(function () { return { error: 'HTTP ' + resp.status }; });
              throw new Error(err.error || 'Request failed');
            }
            var data = await resp.json();
            if (!data.success || !data.text) throw new Error('No text returned');

            // Client-side refusal sniff — belt-and-braces in case the
            // server didn't catch it. We never overwrite the textarea
            // with refusal-shaped text.
            var t = data.text.toLowerCase();
            var refusalSignals = [
              "i'm not able", 'i am not able', "i cannot reproduce",
              "i can't reproduce", 'copyrighted material', 'reproduce the complete',
              'reproduce the full', "i'm unable to", "i can't help with"
            ];
            if (refusalSignals.some(function (p) { return t.indexOf(p) !== -1; })) {
              throw new Error('AI refused to format these lyrics. Try editing manually or pasting a smaller chunk.');
            }

            lyricsTextarea.value = data.text;
            // Trigger preview update + dirty tracking
            lyricsTextarea.dispatchEvent(new Event('input', { bubbles: true }));
            aiBtn.innerHTML = '✓ Done';
            setTimeout(function () { aiBtn.innerHTML = origLabel; aiBtn.disabled = false; }, 1500);
          } catch (e) {
            console.error(e);
            alert(
              'AI Format failed: ' + e.message + '\n\n' +
              'The API server should auto-start with the Manager. ' +
              'If it failed to start, run this in Terminal as a fallback:\n\n' +
              '  cd ~/Desktop/Gigalator/api && node server.js\n\n' +
              '(Then click AI Format again.)'
            );

            aiBtn.disabled = false;
          }

        // Configure the device bezel wrapper to look like the chosen iPad.
        // For 9th gen: bezels are thicker on the LONG edges (where home
        // button + cam live). For Pro: uniform thin bezel.
        var deviceBezelEl = document.getElementById('device-bezel');
        var bezelShort = device.bezel.short;
        var bezelLong = device.bezel.long;
        // In landscape: long edges are horizontal (top/bottom of screen),
        // short edges are vertical (left/right)... wait, actually the
        // home button is on the SHORT edge in landscape (one of the
        // physical short edges sits at the bottom). For 9th gen in
        // landscape, the home button is on the right short edge.
        var padTop, padBottom, padLeft, padRight;
        if (device.hasHome) {
          if (portrait) {
            padTop = bezelLong; padBottom = bezelLong;
            padLeft = bezelShort; padRight = bezelShort;
          } else {
            padLeft = bezelLong; padRight = bezelLong;
            padTop = bezelShort; padBottom = bezelShort;
          }
        } else {
          padTop = bezelShort; padBottom = bezelShort;
          padLeft = bezelShort; padRight = bezelShort;

        deviceBezelEl.style.width = (ipadW + padLeft + padRight) + 'px';
        deviceBezelEl.style.height = (ipadH + padTop + padBottom) + 'px';
        deviceBezelEl.style.padding = padTop + 'px ' + padRight + 'px ' + padBottom + 'px ' + padLeft + 'px';
        // Pro models have rounded screen corners; 9th gen has square corners.
        deviceBezelEl.style.borderRadius = device.hasHome ? '8px' : '36px';
        // Class flags for orientation- and family-specific positioning of
        // the home button and camera dot.
        deviceBezelEl.classList.remove('ipad-9', 'ipad-pro', 'portrait', 'landscape', 'has-home');
        deviceBezelEl.classList.add(device.family);
        deviceBezelEl.classList.add(portrait ? 'portrait' : 'landscape');

        // Match the scaler to the FULL device size (bezel included) so

        var fullW = ipadW + padLeft + padRight;

        previewFrameEl.style.setProperty('--preview-safe-bottom', safe.bottom + 'px');

        // Scale down to fit in the available editor width — scale factor
        // accounts for the FULL device (screen + bezel), not just the screen.
        var availableWidth = previewContainer.parentElement.clientWidth;
        var scale = Math.min(1, availableWidth / fullW);

        // Set the container height to match the scaled preview (full device)
        previewContainer.style.height = Math.ceil(fullH * scale) + 'px';

          setStatus('Splitting PDF pages...', 'processing');

          // Set up PDF.js worker
          var pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

          var pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          var numPages = Math.min(pdfDoc.numPages, 5);

          // Preserve unsaved edits
          var titleInput = document.getElementById('song-title');
          var artistInput = document.getElementById('song-artist');
          var lyricsInput = document.getElementById('song-lyrics');
          var fontSlider = document.getElementById('song-fontsize');
          if (titleInput) song.title = titleInput.value.trim();
          if (artistInput) song.artist = artistInput.value.trim();
          if (lyricsInput) song.lyrics = lyricsInput.value;
          if (fontSlider) {

          if (!song.sheets) song.sheets = [];

          for (var p = 1; p <= numPages; p++) {
            var page = await pdfDoc.getPage(p);
            var scale = 2; // High-res render
            var viewport = page.getViewport({ scale: scale });

            var canvas = document.createElement('canvas');

    async function saveSong(songId) {
      var song = data.songs[songId];
      var newTitle = document.getElementById('song-title').value.trim();
      var newArtist = document.getElementById('song-artist').value.trim();
      var newLyrics = document.getElementById('song-lyrics').value;
      var newFontSize = parseInt(document.getElementById('song-fontsize').value, 10);

      if (!newTitle) { alert('Title is required'); return; }

      // Check if ID needs to change
      var newId = slugify(newTitle);
      if (newId !== songId && data.songs[newId]) {
        newId = newId + '-' + Date.now();
      }

      song.title = newTitle;
      song.artist = newArtist;
      song.lyrics = newLyrics;
      song.fontSize = newFontSize === 30 ? null : newFontSize;

      // Save sheet size preference
      var sheetSizeEl = document.getElementById('sheet-size-slider');
      if (sheetSizeEl) {
        var ss = parseInt(sheetSizeEl.value, 10);
        song.sheetSize = ss === 400 ? null : ss;
      }

      if (newId !== songId) {
        data.songs[newId] = song;
        delete data.songs[songId];

        // Update setlists
        data.setlists.forEach(function (sl) {
          var idx = sl.songs.indexOf(songId);
          if (idx !== -1) sl.songs[idx] = newId;
        });

        selectedId = newId;
      }

      await saveData();
      renderSidebar();
    }

    function deleteSong(songId) {
      delete data.songs[songId];

      // Remove from setlists
      data.setlists.forEach(function (sl) {
        sl.songs = sl.songs.filter(function (id) { return id !== songId; });
      });

      selectedId = null;
      saveData();
      renderSidebar();
      showWelcome();
    }

      data.songs[id] = {

        artist: '',
        lyrics: '',
        track: null,
        fontSize: null
      };

    }

    // ── Helper: pick a file in either mode ──
    async function pickFileCompat(filters, browserAccept) {
      if (isElectron) {
        var result = await window.electronAPI.pickFile(filters);
        if (!result) throw Object.assign(new Error('Cancelled'), { name: 'AbortError' });
        // result = { name, data (Buffer) }
        return { name: result.name, arrayBuffer: result.data.buffer || result.data };
      } else {
        var pickerOpts = { types: [{ description: filters[0].name, accept: browserAccept }] };
        var fileHandles = await window.showOpenFilePicker(pickerOpts);
        var file = await fileHandles[0].getFile();
        var ab = await file.arrayBuffer();
        return { name: file.name, arrayBuffer: ab };
      }
    }

    // ── Helper: write a binary file ──
    async function writeFileCompat(relPath, dataOrBlob) {
      if (isElectron) {
        var ab;
        if (dataOrBlob instanceof Blob) {
          ab = await dataOrBlob.arrayBuffer();
        } else if (dataOrBlob instanceof ArrayBuffer) {
          ab = dataOrBlob;
        } else {
          ab = dataOrBlob;
        }
        await window.electronAPI.writeBinaryFile(relPath, ab);
      } else {
        // Determine which directory handle to use
        var parts = relPath.split('/');
        var dir = parts[0];
        var fname = parts.slice(1).join('/');
        var handle = dir === 'tracks' ? tracksHandle : dir === 'sheets' ? sheetsHandle : null;
        if (!handle) throw new Error('Unknown directory: ' + dir);
        var fileHandle = await handle.getFileHandle(fname, { create: true });
        var writable = await fileHandle.createWritable();
        await writable.write(dataOrBlob);
        await writable.close();
      }
    }

    // ── Helper: delete a file ──
    async function deleteFileCompat(relPath) {
      if (isElectron) {
        await window.electronAPI.deleteFile(relPath);
      } else {
        var parts = relPath.split('/');
        var dir = parts[0];
        var fname = parts.slice(1).join('/');
        var handle = dir === 'tracks' ? tracksHandle : dir === 'sheets' ? sheetsHandle : null;
        if (handle) await handle.removeEntry(fname);
      }
    }

    // ── Helper: read a file as object URL ──
    async function readFileAsURL(relPath) {
      if (isElectron) {
        var buf = await window.electronAPI.readBinaryFile(relPath);
        var blob = new Blob([buf]);
        return URL.createObjectURL(blob);
      } else {
        var parts = relPath.split('/');
        var dir = parts[0];
        var fname = parts.slice(1).join('/');
        var handle = dir === 'tracks' ? tracksHandle : dir === 'sheets' ? sheetsHandle : null;
        if (!handle) throw new Error('Unknown directory: ' + dir);
        var fh = await handle.getFileHandle(fname);
        var file = await fh.getFile();
        return URL.createObjectURL(file);
      }
    }

    // ── Track upload ──
    async function uploadTrack(songId) {
      try {
        var picked = await pickFileCompat(
          [{ name: 'Audio files', extensions: ['mp3', 'm4a', 'wav', 'ogg'] }],
          { 'audio/*': ['.mp3', '.m4a', '.wav', '.ogg'] }
        );

        // Kebab-case the filename for web compatibility
        var ext = picked.name.substring(picked.name.lastIndexOf('.'));
        var baseName = picked.name.substring(0, picked.name.lastIndexOf('.'));
        var filename = baseName.toLowerCase().replace(/['''()]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + ext;

        // Write to tracks directory
        await writeFileCompat('tracks/' + filename, picked.arrayBuffer);

        // Preserve any unsaved edits before re-rendering
        var titleInput = document.getElementById('song-title');
        var artistInput = document.getElementById('song-artist');
        var lyricsInput = document.getElementById('song-lyrics');
        var fontSlider = document.getElementById('song-fontsize');
        if (titleInput) data.songs[songId].title = titleInput.value.trim();
        if (artistInput) data.songs[songId].artist = artistInput.value.trim();
        if (lyricsInput) data.songs[songId].lyrics = lyricsInput.value;
        if (fontSlider) {
          var fs = parseInt(fontSlider.value, 10);
          data.songs[songId].fontSize = fs === 30 ? null : fs;
        }

        data.songs[songId].track = 'tracks/' + filename;
        setStatus('Track uploaded: ' + filename, 'saved');
        showSongEditor(songId);
      } catch (e) {
        if (e.name !== 'AbortError') {
          setStatus('Upload failed: ' + e.message, 'error');
        }
      }
    }

    // ── Setlist Editor ──
    function showSetlistEditor(setlistId) {
      var sl = data.setlists.find(function (s) { return s.id === setlistId; });
      if (!sl) return;

      var songsHtml = '';
      sl.songs.forEach(function (songId, i) {
        var song = data.songs[songId];
        var title = song ? song.title : songId + ' (missing)';
        songsHtml += '<div class="setlist-song-item" data-index="' + i + '">'
          + '<span class="song-name">' + esc(title) + '</span>'
          + '<div class="move-btns">'
          + '<button class="move-btn" data-dir="up" data-i="' + i + '" title="Move up">&#8593;</button>'
          + '<button class="move-btn" data-dir="down" data-i="' + i + '" title="Move down">&#8595;</button>'
          + '</div>'
          + '<button class="remove-btn" data-i="' + i + '" title="Remove">&times;</button>'
          + '</div>';
      });

      // Songs available to add (not already in setlist)
      var availableSongs = Object.keys(data.songs).filter(function (id) {
        return sl.songs.indexOf(id) === -1;
      }).sort(function (a, b) {
        return data.songs[a].title.localeCompare(data.songs[b].title);
      });

      var pickerHtml = '';
      availableSongs.forEach(function (id) {
        var s = data.songs[id];
        pickerHtml += '<div class="song-picker-item" data-pick-id="' + id + '">'
          + '<input type="checkbox" value="' + id + '">'
          + '<span class="picker-title">' + esc(s.title) + '</span>'
          + '<span class="picker-artist">' + esc(s.artist) + '</span>'
          + '</div>';
      });

      editor.innerHTML = '<div class="editor-title">Edit Setlist</div>'
        + '<div class="form-group">'
        + '<label>Setlist Name</label>'
        + '<input type="text" id="setlist-name" value="' + escAttr(sl.name) + '">'
        + '</div>'
        + '<div class="form-group">'
        + '<label>Songs in Setlist (' + sl.songs.length + ')</label>'
        + '<div class="setlist-songs" id="setlist-songs">'
        + (songsHtml || '<div style="padding:16px;text-align:center;color:var(--text-dim)">No songs yet</div>')
        + '</div>'
        + '</div>'
        + '<div class="form-group">'
        + '<label>Add Songs</label>'
        + '<div class="song-picker">'
        + '<div class="song-picker-header">'
        + '<input type="text" class="song-picker-search" id="song-picker-search" placeholder="Search songs...">'
        + '</div>'
        + '<div class="song-picker-list" id="song-picker-list">'
        + (pickerHtml || '<div class="song-picker-empty">All songs already in setlist</div>')
        + '</div>'
        + '<div class="song-picker-actions">'
        + '<span class="song-picker-count" id="picker-count">0 selected</span>'
        + '<button class="btn btn-sm btn-primary" id="add-selected-btn">Add Selected</button>'
        + '</div>'
        + '</div>'
        + '</div>'
        + '<div class="actions-bar">'
        + '<button class="btn btn-danger" id="delete-setlist-btn">Delete Setlist</button>'
        + '<button class="btn" id="duplicate-setlist-btn">Duplicate as New Setlist</button>'
        + '<div class="spacer"></div>'
        + '<button class="btn btn-primary" id="save-setlist-btn">Save Changes</button>'
        + '</div>';

      // Move buttons
      document.querySelectorAll('.move-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var idx = parseInt(btn.getAttribute('data-i'), 10);
          var dir = btn.getAttribute('data-dir');
          if (dir === 'up' && idx > 0) {
            var tmp = sl.songs[idx];
            sl.songs[idx] = sl.songs[idx - 1];
            sl.songs[idx - 1] = tmp;
          } else if (dir === 'down' && idx < sl.songs.length - 1) {
            var tmp2 = sl.songs[idx];
            sl.songs[idx] = sl.songs[idx + 1];
            sl.songs[idx + 1] = tmp2;
          }
          showSetlistEditor(setlistId);
        });
      });

      // Remove buttons
      document.querySelectorAll('.remove-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var idx = parseInt(btn.getAttribute('data-i'), 10);
          sl.songs.splice(idx, 1);
          showSetlistEditor(setlistId);
        });
      });

      // Song picker — search filter
      document.getElementById('song-picker-search').addEventListener('input', function () {
        var query = this.value.toLowerCase();
        document.querySelectorAll('.song-picker-item').forEach(function (item) {
          var title = item.querySelector('.picker-title').textContent.toLowerCase();
          var artist = item.querySelector('.picker-artist').textContent.toLowerCase();
          item.style.display = (title.indexOf(query) !== -1 || artist.indexOf(query) !== -1) ? '' : 'none';
        });
      });

      // Song picker — checkbox click (also toggle when clicking the row)
      document.querySelectorAll('.song-picker-item').forEach(function (item) {
        item.addEventListener('click', function (e) {
          if (e.target.tagName !== 'INPUT') {
            var cb = item.querySelector('input[type="checkbox"]');
            cb.checked = !cb.checked;
          }
          updatePickerCount();
        });
      });

      function updatePickerCount() {
        var checked = document.querySelectorAll('.song-picker-item input:checked');
        var countEl = document.getElementById('picker-count');
        if (countEl) countEl.textContent = checked.length + ' selected';
      }

      // Add selected songs
      document.getElementById('add-selected-btn').addEventListener('click', function () {
        var checked = document.querySelectorAll('.song-picker-item input:checked');
        if (checked.length === 0) return;
        checked.forEach(function (cb) {
          sl.songs.push(cb.value);
        });
        showSetlistEditor(setlistId);
      });

      // Save
      document.getElementById('save-setlist-btn').addEventListener('click', function () {
        var btn = this;
        var newName = document.getElementById('setlist-name').value.trim();
        if (!newName) { alert('Name is required'); return; }

        var newSlId = slugify(newName);
        if (newSlId !== sl.id) {
          // Check for duplicates
          var existing = data.setlists.find(function (s) { return s.id === newSlId && s !== sl; });
          if (existing) newSlId = newSlId + '-' + Date.now();
          sl.id = newSlId;
          selectedId = newSlId;
        }

        sl.name = newName;
        saveData();
        renderSidebar();

        btn.textContent = 'Saved!';
        btn.style.background = '#2e7d32';
        btn.style.borderColor = '#2e7d32';
        setTimeout(function () {
          btn.textContent = 'Save Changes';
          btn.style.background = '';
          btn.style.borderColor = '';
        }, 1500);
      });

      // Duplicate as new setlist
      document.getElementById('duplicate-setlist-btn').addEventListener('click', function () {
        var newId = 'setlist-' + Date.now();
        var newSl = {
          id: newId,
          name: sl.name + ' (copy)',
          songs: sl.songs.slice()  // copy the array
        };
        data.setlists.push(newSl);
        selectedId = newId;
        renderSidebar();
        showSetlistEditor(newId);
        setStatus('Duplicated "' + sl.name + '" — edit and rename the copy', 'saved');
      });

      // Delete
      document.getElementById('delete-setlist-btn').addEventListener('click', function () {
        if (confirm('Delete setlist "' + sl.name + '"?')) {
          data.setlists = data.setlists.filter(function (s) { return s.id !== setlistId; });
          selectedId = null;
          saveData();
          renderSidebar();
          showWelcome();
        }
      });
    }

    function addNewSetlist() {
      var id = 'setlist-' + Date.now();
      data.setlists.push({
        id: id,
        name: 'New Setlist',
        songs: []
      });
      selectedId = id;
      renderSidebar();
      showSetlistEditor(id);
    }

    // ── Helpers ──
    function esc(str) {
      var d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function escAttr(str) {
      return (str || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function slugify(str) {
      return str.toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '')
        .substring(0, 60);
    }

    // ── Deploy to GitHub ──
    var GITHUB_OWNER = 'darrenmjohnstone';
    var GITHUB_REPO = 'Gigalator';
    var deployBtn = document.getElementById('deploy-btn');

    deployBtn.addEventListener('click', deployToGitHub);

    async function deployToGitHub() {
      if (isElectron) {
        // Electron mode: git add, commit, push — handles everything (songs, tracks, sheets)
        deployBtn.disabled = true;
        deployBtn.className = 'btn-deploy deploying';
        deployBtn.textContent = 'Deploying...';

        try {
          var result = await window.electronAPI.gitDeploy();
          deployBtn.className = 'btn-deploy success';
          deployBtn.textContent = 'Deployed!';
          setStatus(result.message, 'saved');
          setTimeout(function () {
            deployBtn.className = 'btn-deploy';
            deployBtn.textContent = 'Deploy to iPad App';
            deployBtn.disabled = false;
          }, 3000);
        } catch (e) {
          deployBtn.className = 'btn-deploy failed';
          deployBtn.textContent = 'Deploy failed — try again';
          setStatus('Deploy failed: ' + e.message, 'error');
          deployBtn.disabled = false;
        }
        return;
      }

      // Browser mode: GitHub API (songs.json only)
      var token = localStorage.getItem('gigalator-gh-token');
      if (!token) {
        showTokenModal();
        return;
      }

      deployBtn.disabled = true;
      deployBtn.className = 'btn-deploy deploying';
      deployBtn.textContent = 'Deploying...';

      try {
        var file = await songsHandle.getFile();
        var content = await file.text();
        var encoded = btoa(unescape(encodeURIComponent(content)));

        // Get current file SHA from GitHub
        var resp = await fetch('https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/songs/songs.json', {
          headers: { 'Authorization': 'token ' + token }
        });

        if (resp.status === 401) {
          localStorage.removeItem('gigalator-gh-token');
          deployBtn.className = 'btn-deploy failed';
          deployBtn.textContent = 'Token expired — click to reconnect';
          deployBtn.disabled = false;
          return;
        }

        var fileData = await resp.json();
        var sha = fileData.sha;

        // Push updated content
        var putResp = await fetch('https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/songs/songs.json', {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update songs — ' + new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
            content: encoded,
            sha: sha
          })
        });

        if (putResp.ok) {
          deployBtn.className = 'btn-deploy success';
          deployBtn.textContent = 'Deployed!';
          setStatus('Deployed to iPad app', 'saved');
          setTimeout(function () {
            deployBtn.className = 'btn-deploy';
            deployBtn.textContent = 'Deploy to iPad App';
            deployBtn.disabled = false;
          }, 3000);
        } else {
          var err = await putResp.json();
          throw new Error(err.message || 'Deploy failed');
        }
      } catch (e) {
        deployBtn.className = 'btn-deploy failed';
        deployBtn.textContent = 'Deploy failed — try again';
        setStatus('Deploy failed: ' + e.message, 'error');
        deployBtn.disabled = false;
      }
    }

    function showTokenModal() {
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = '<div class="modal">'
        + '<h3>Connect to GitHub</h3>'
        + '<p>To deploy directly from the manager, you need a GitHub personal access token. '
        + 'Create one at <a href="https://github.com/settings/tokens/new?scopes=repo&description=Gigalator" target="_blank">github.com/settings/tokens</a> '
        + 'with <strong>repo</strong> scope. You only need to do this once.</p>'
        + '<input type="text" id="token-input" placeholder="ghp_xxxxxxxxxxxx">'
        + '<div class="modal-btns">'
        + '<button class="btn" id="token-cancel">Cancel</button>'
        + '<button class="btn btn-primary" id="token-save">Save &amp; Deploy</button>'
        + '</div>'
        + '</div>';

      document.body.appendChild(overlay);

      document.getElementById('token-cancel').addEventListener('click', function () {
        overlay.remove();
      });

      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) overlay.remove();
      });

      document.getElementById('token-save').addEventListener('click', function () {
        var token = document.getElementById('token-input').value.trim();
        if (!token) return;
        localStorage.setItem('gigalator-gh-token', token);
        overlay.remove();
        deployToGitHub();
      });
    }

    function setStatus(msg, cls) {
      statusBar.textContent = msg;
      statusBar.className = 'status-bar';
      if (cls) statusBar.classList.add(cls);
      if (cls === 'saved') {
        setTimeout(function () {
          if (statusBar.textContent === msg) {
            statusBar.textContent = dirHandle ? 'Folder: ' + dirHandle.name : 'Ready';
            statusBar.className = 'status-bar';
          }
        }, 3000);
      }
    }
  })();
  </script>
</body>
</html>
